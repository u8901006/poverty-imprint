name: Poverty Imprint Daily Report

on:
  schedule:
    - cron: "40 9 * * *"  # UTC 09:40 = GMT+8 17:40
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch papers from PubMed
        env:
          PUBMED_DAYS: "7"
          PUBMED_MAX_PAPERS: "40"
          REPORT_DATE: ${{ steps.date.outputs.target }}
        run: node scripts/fetch-papers.mjs
        timeout-minutes: 8
        continue-on-error: true

      - name: Check papers data
        id: papers
        run: |
          if [ -f papers.json ]; then
            COUNT=$(node -e "import{readFileSync}from'fs';const d=JSON.parse(readFileSync('papers.json'));console.log(d.count||0)")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            node -e "import{writeFileSync}from'fs';writeFileSync('papers.json',JSON.stringify({date:'${{ steps.date.outputs.target }}',count:0,papers:[]},null,2))"
          fi

      - name: Generate report with NVIDIA Nemotron
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: "https://integrate.api.nvidia.com/v1"
          NVIDIA_MAX_TOKENS: "16384"
          NVIDIA_TIMEOUT_MS: "480000"
          REPORT_DATE: ${{ steps.date.outputs.target }}
        run: node scripts/generate-report.mjs
        timeout-minutes: 12

      - name: Generate index page
        run: node scripts/generate-index.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "poverty imprint daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        run: |
          echo "### Poverty Imprint Daily Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.date.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Papers analyzed:** ${{ steps.papers.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report:** [poverty-${{ steps.date.outputs.target }}.html](https://u8901006.github.io/poverty-imprint/poverty-${{ steps.date.outputs.target }}.html)" >> "$GITHUB_STEP_SUMMARY"
